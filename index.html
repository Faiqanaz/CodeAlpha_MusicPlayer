<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura - Music Player</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

  <div class="player-card">
    <!-- Header Controls -->
    <header class="top-bar">
      <button class="icon-btn" id="playlist-toggle-btn" title="Toggle Playlist">
        <i class="fa-solid fa-list-ul"></i>
      </button>
      <span class="app-title">Now Playing</span>
      <button class="icon-btn toggle-active" id="autoplay-btn" title="Toggle Autoplay">
        <i class="fa-solid fa-repeat"></i>
      </button>
    </header>

    <!-- Visualizer / Cover Art Area -->
    <div class="cover-wrapper">
      <div class="glow-effect" id="glow"></div>
      <div class="cover-art" id="cover-art">
        <i class="fa-solid fa-compact-disc disc-icon" id="disc-icon"></i>
      </div>
    </div>

    <!-- Song Details -->
    <div class="track-details">
      <h2 id="song-title">Loading...</h2>
      <p id="artist-name">...</p>
    </div>

    <!-- Audio Element -->
    <audio id="audio-player" crossorigin="anonymous"></audio>

    <!-- Progress Bar & Timestamps -->
    <div class="progress-container">
      <div class="time-stamps">
        <span id="current-time">0:00</span>
        <span id="duration-time">0:00</span>
      </div>
      <div class="progress-bar-wrapper" id="progress-wrapper">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
    </div>

    <!-- Playback Controls -->
    <div class="controls-row">
      <button class="control-btn" id="prev-btn" title="Previous Track">
        <i class="fa-solid fa-backward-step"></i>
      </button>
      <button class="control-btn play-btn" id="play-btn" title="Play/Pause">
        <i class="fa-solid fa-play" id="play-icon"></i>
      </button>
      <button class="control-btn" id="next-btn" title="Next Track">
        <i class="fa-solid fa-forward-step"></i>
      </button>
    </div>

    <!-- Volume Control -->
    <div class="volume-container">
      <i class="fa-solid fa-volume-high volume-icon" id="volume-icon"></i>
      <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.01" value="0.8">
    </div>

    <!-- Slide-up Playlist Panel -->
    <div class="playlist-panel" id="playlist-panel">
      <div class="playlist-header">
        <h3>Playlist</h3>
        <button class="close-btn" id="playlist-close-btn">&times;</button>
      </div>
      <ul class="song-list" id="song-list"></ul>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
